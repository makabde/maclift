# tmux configuration (tmux 3.8, prefix Ctrl+s)
#
# ~/.tmux.conf links here. The settings live in tmux/, one file per topic,
# each line with a short comment. Key cheat sheet: tmux/README.md.
#
#   tmux/options.conf  terminal, timing, copy mode, mouse, bell
#   tmux/status.conf   status bar, titles, borders
#   tmux/keys.conf     key bindings
#   tmux/plugins.conf  plugin list and plugin options
#
# Paths are literal (~/.maclift/...) because tpm only expands ~ and $HOME when
# it reads @plugin lines from sourced files. ~/.maclift is a link maclift
# makes to wherever you cloned it.

source-file ~/.maclift/dotfiles/shell/tmux/options.conf
source-file ~/.maclift/dotfiles/shell/tmux/status.conf
source-file ~/.maclift/dotfiles/shell/tmux/keys.conf
source-file ~/.maclift/dotfiles/shell/tmux/plugins.conf

# Start the plugin manager, then match the theme to the macOS appearance.
# tpm runs in the foreground so the theme script sees catppuccin loaded.
# Keep these lines last.
run '~/.tmux/plugins/tpm/tpm'
run -b '~/.maclift/dotfiles/shell/tmux/theme.sh'
