# ----------------------------------------------------------------------
# | Plugins (tpm)                                                      |
# ----------------------------------------------------------------------
# Installed into ~/.tmux/plugins by tpm: prefix I installs, prefix U
# updates, prefix M-u removes plugins no longer listed here.
# Plugin options must be set before tpm runs (last line of tmux.conf).

set -g @plugin 'tmux-plugins/tpm'                    # plugin manager
set -g @plugin 'tmux-plugins/tmux-sensible'          # sane defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'         # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'         # auto-save sessions
set -g @plugin 'catppuccin/tmux'                     # theme and status modules
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'  # PREFIX/COPY/SYNC indicator
set -g @plugin 'tmux-plugins/tmux-yank'              # copy to the macOS clipboard
set -g @plugin 'tmux-plugins/tmux-open'              # open files/URLs from copy mode
set -g @plugin 'sainnhe/tmux-fzf'                    # fzf menus for tmux
set -g @plugin 'Morantron/tmux-fingers'              # copy hints for paths, hashes, URLs
set -g @plugin 'laktak/extrakto'                     # fzf over the pane's scrollback

# --- catppuccin --------------------------------------------------------
# v2 only provides format strings; status.conf builds the bar from them.
# Flavor follows macOS: latte in Light mode, mocha in Dark mode. theme.sh
# picks it at tmux start; these hooks switch it when iTerm2 reports an
# appearance change (tmux 3.6+). mocha is only the first-load default.
set -g @catppuccin_flavor 'mocha'
set-hook -g client-light-theme "run-shell -b '~/.maclift/dotfiles/shell/tmux/theme.sh light'"
set-hook -g client-dark-theme "run-shell -b '~/.maclift/dotfiles/shell/tmux/theme.sh dark'"
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
# Show window flags as icons, including the bell (Claude Code waiting).
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_date_time_text ' %H:%M'

# --- tmux-prefix-highlight ---------------------------------------------
# Also show when copy mode or synchronized panes are on.
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'

# --- tmux-yank ---------------------------------------------------------
# Its "copy the command line" key defaults to prefix y, which would hide
# our clear-screen key. Move it to prefix C-y. prefix Y copies the pane's
# folder; in copy mode, y copies the selection.
set -g @yank_line 'C-y'

# --- tmux-fzf ----------------------------------------------------------
# prefix F opens its menu (sessions, windows, panes, commands, keys).

# --- tmux-open ---------------------------------------------------------
# In copy mode: o opens the selection, C-o opens it in $EDITOR,
# S searches it on the web.

# --- tmux-fingers ------------------------------------------------------
# prefix u highlights paths, hashes, URLs and IPs with letter hints; type
# a hint to copy it. Its default key, F, belongs to tmux-fzf.
set -g @fingers-key 'u'
# prefix J jumps copy mode to a hint instead of copying it.
set -g @fingers-jump-key 'J'

# --- extrakto ----------------------------------------------------------
# prefix X: fzf over the pane's scrollback (words, paths, URLs, lines).
# Tab inserts the pick into the pane, Enter copies it. Its default key,
# Tab, is tmux 3.8's built-in floating pane.
set -g @extrakto_key 'X'
set -g @extrakto_popup_size '70%,50%'
set -g @extrakto_split_direction 'p'

# --- tmux-resurrect ----------------------------------------------------
# prefix C-s saves sessions, prefix C-r restores them.
# Restore nvim sessions (Session.vim) when restoring panes.
set -g @resurrect-strategy-nvim 'session'
# Don't save pane contents; they can contain secrets and grow large.
set -g @resurrect-capture-pane-contents 'off'

# --- tmux-continuum ----------------------------------------------------
# Auto-save every 15 minutes (continuum's default; the value is in minutes).
# A save is a small snapshot of the layout, since pane contents aren't saved.
set -g @continuum-save-interval '15'
# Continuum's auto-restore is off: it caused a "Restoring" loop. Instead,
# running `tmux` with no server up restores the last save and attaches to it
# (zsh/functions/tmux). Restore by hand with prefix C-r.
set -g @continuum-restore 'off'
# Don't start tmux at login.
set -g @continuum-boot 'off'
set -g @continuum-boot-options 'iterm'
