# ----------------------------------------------------------------------
# | Key bindings                                                       |
# ----------------------------------------------------------------------
# "prefix x" means: press Ctrl+s, let go, then press x.
# Plugin keys are set in plugins.conf. Cheat sheet: README.md.

# --- Prefix ------------------------------------------------------------

# Prefix is Ctrl+s instead of Ctrl+b (easier to reach).
unbind C-b
set -g prefix C-s
# Note: tmux-resurrect later rebinds prefix C-s to "save session".
bind C-s send-prefix

# --- Splits ------------------------------------------------------------

# | splits side by side, - splits top/bottom; both keep the current folder.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Moving between panes and windows ----------------------------------

# hjkl moves between panes, like Ctrl+w in vim.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+arrow moves between panes without the prefix.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift+arrow moves between windows without the prefix.
bind -n S-Left previous-window
bind -n S-Right next-window

# C-h / C-l move the window one place left / right (repeatable). Numbers
# stay in order because swap-window keeps them contiguous.
bind -r C-h swap-window -d -t -1
bind -r C-l swap-window -d -t +1

# D shrinks the pane by 8 lines.
bind D resize-pane -D 8

# Enter zooms the pane to full window and back (focus on Claude Code).
bind Enter resize-pane -Z

# --- Config ------------------------------------------------------------

# e opens the config in nvim and reloads it when you quit.
unbind e
bind e new-window -n 'tmux config' "sh -c 'nvim ~/.maclift/dotfiles/shell/tmux.conf ~/.maclift/dotfiles/shell/tmux/*.conf && tmux source ~/.tmux.conf'"

# r reloads the config.
unbind r
bind r source-file ~/.tmux.conf \; display 'Reloaded tmux config'

# --- Toggles -----------------------------------------------------------

# m toggles the mouse.
unbind m
bind m setw mouse

# a toggles typing into all panes of the window at once.
bind a setw synchronize-panes

# --- Clearing ----------------------------------------------------------

# y clears the pane's screen and scrollback. It types nothing into the
# pane, so it can't interrupt a running program like Claude Code. A shell
# prompt reappears on the next Enter.
bind y send-keys -R \; clear-history \; display 'Screen cleared'

# --- Copy mode (vi keys; mode-keys vi is set in options.conf) ----------

# / starts copy mode and searches up through the scrollback.
bind / copy-mode \; send-keys ?

# v starts a selection, V selects lines, r toggles block selection.
# y (copy to clipboard) comes from tmux-yank.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi r send -X rectangle-toggle

# / and ? search as you type.
bind -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""

# --- Sessions ----------------------------------------------------------

# C-p creates a session for a project, starting in the current folder.
bind C-p command-prompt -p "Project name:" "new-session -s '%%' -c '#{pane_current_path}'"

# S picks a session with fzf.
bind S display-popup -E "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs tmux switch-client -t"

# --- Layout presets ----------------------------------------------------

# M-1: main pane + terminal on the right (70/30).
bind M-1 split-window -h -l 30%
# M-2: main pane + terminal and logs stacked on the right.
bind M-2 split-window -h -l 30% \; split-window -v -l 50%
# M-3: main pane + server, tests and logs stacked on the right.
bind M-3 split-window -h -l 30% \; split-window -v -l 66% \; split-window -v -l 50%
