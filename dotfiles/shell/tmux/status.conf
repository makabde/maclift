# ----------------------------------------------------------------------
# | Status bar, titles and borders                                     |
# ----------------------------------------------------------------------
# The theme (catppuccin) is configured in plugins.conf; this file holds
# layout and colours that don't come from the theme.

# Redraw every 15s. Faster refreshes collide with Claude Code repaints.
set -g status-interval 15

# Room for the session name on the left and the modules on the right.
set -g status-left-length 32
set -g status-right-length 150

# Status bar content. The #{E:@catppuccin_*} modules come from catppuccin.
# One space before the first tab and between tabs, so the rounded tabs
# don't touch the screen edge or each other.
set -g status-left ' '
set -g window-status-separator ' '
# Auto-save (tmux-continuum). Continuum adds this itself at startup, but it
# skips it when it thinks another tmux server is running, and it guesses
# wrong. Double quotes so $HOME expands to the path continuum looks for.
set -g status-right "#($HOME/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
set -ag status-right '#{E:@catppuccin_status_application}'
set -ag status-right '#{E:@catppuccin_status_session}'
set -ag status-right '#{E:@catppuccin_status_date_time}'
# Shows PREFIX / COPY / SYNC while those modes are active (tmux-prefix-highlight).
set -ag status-right '#{prefix_highlight}'

# A window that rang the bell stands out until you visit it: yellow,
# coloured by theme.sh to match the flavor.

# iTerm2 tab title: "session: window".
set -g set-titles on
set -g set-titles-string '#S: #W'

# Pane borders (grey inactive, mauve active), pane numbers and the copy-mode
# selection are coloured by theme.sh from the current catppuccin flavor.

# prefix q shows pane numbers for 2s, so there's time to press one.
set -g display-panes-time 2000
