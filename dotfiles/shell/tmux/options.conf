# ----------------------------------------------------------------------
# | Options                                                            |
# ----------------------------------------------------------------------
# Server, session and window behaviour. Sourced from ~/.tmux.conf.
# Reference: man tmux, section OPTIONS.

# --- Terminal ----------------------------------------------------------

# Programs inside tmux see a terminal that supports 256 colours and italics.
set -g default-terminal "tmux-256color"
# iTerm2 reports xterm-256color: allow true colour and synchronized output.
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:Sync"

# Pass modified keys (Shift+Enter, Ctrl+Enter...) through to programs.
# Claude Code needs this to tell Shift+Enter (new line) from Enter (send).
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Let OSC sequences (titles, hyperlinks, clipboard) reach iTerm2.
set -g allow-passthrough on

# Let programs in tmux copy to the macOS clipboard (OSC 52).
set -g set-clipboard on

# Tell programs when their pane gains or loses focus (vim, Claude Code).
set -g focus-events on

# Same background in every pane: don't dim the panes you're not in.
set -g window-style default
set -g window-active-style default

# --- Shell -------------------------------------------------------------

# New panes run zsh, whatever the login shell is.
set -g default-shell /bin/zsh
set -g default-command /bin/zsh

# --- Timing ------------------------------------------------------------

# Wait only 10ms after Escape, so Esc in vim and Claude Code feels instant.
set -g escape-time 10

# Repeatable keys (bind -r) stay active for 300ms.
set -g repeat-time 300

# --- Windows and panes -------------------------------------------------

# Number windows and panes from 1, to match the keyboard.
set -g base-index 1
set -g pane-base-index 1

# Close the gaps when a window is closed or moved away (1 2 4 becomes 1 2 3).
# Panes need no setting: tmux always numbers them by position.
set -g renumber-windows on

# Sessions have no base-index. Unnamed sessions get numbers from a counter
# that starts at 0 and never resets, so renumber them to 1, 2, 3... whenever
# a session is created or closed. Named sessions are untouched.
set-hook -g session-created 'run-shell -b "~/.maclift/dotfiles/shell/tmux/renumber-sessions.sh"'
set-hook -g session-closed 'run-shell -b "~/.maclift/dotfiles/shell/tmux/renumber-sessions.sh"'

# Name windows after the running program. Windows you rename by hand,
# like "server", keep their name, so `-t mysession:server` stays stable.
setw -g automatic-rename on

# Keep a lot of scrollback (capture-pane and extrakto read it).
set -g history-limit 100000

# --- Copy mode ---------------------------------------------------------

# Vim keys in copy mode. The copy-mode-vi bindings in keys.conf need this.
setw -g mode-keys vi

# --- Mouse -------------------------------------------------------------

# Click to focus panes, drag borders, scroll into copy mode (prefix m toggles).
set -g mouse on

# --- Bell --------------------------------------------------------------

# Claude Code rings the bell when it finishes or waits for you (set its
# notification channel to "terminal bell"). Flag the window that rang in
# the status bar; the window you're looking at isn't flagged.
setw -g monitor-bell on
set -g bell-action other
set -g visual-bell off
